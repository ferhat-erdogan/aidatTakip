<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d1117">
    <title>Giriş | Aidat Takip Sistemi</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div id="toast">
        <div id="toastMain" class="flex items-center gap-3">
            <i id="toastIcon" class="fa-solid fa-circle-notch fa-spin"></i>
            <span id="toastMsg">...</span>
        </div>
        <div id="confirmActionBtns" class="hidden flex gap-2 w-full mt-2">
            <button id="btnConfirmYes" class="flex-1 bg-[#ff3e3e] text-white p-4 rounded-xl font-black text-[10px] uppercase active:scale-95">EVET, ÇIK</button>
            <button onclick="closeToast()" class="flex-1 bg-white/10 p-4 rounded-xl font-black text-[10px] uppercase active:scale-95">İPTAL</button>
        </div>
    </div>

    <div class="glass-card">
        <div class="text-center">
            <div class="brand-icon">
                <i class="fa-solid fa-building-user"></i>
            </div>
            <h1>Aidat<span>Takip</span></h1>
            <p class="subtitle mt-2">YÖNETİCİ PANELİ</p>
        </div>

        <div id="paramErrorArea" class="hidden">
            <div class="info-message text-center" style="border-left-color: var(--danger); background: rgba(255,62,62,0.1);">
                <i class="fa-solid fa-triangle-exclamation text-[#ff3e3e] mr-2"></i>
                <span class="text-[#ff3e3e] font-bold">BAĞLANTI PARAMETRELERİ TANIMLI DEĞİL</span>
                <p class="text-[11px] mt-2 text-white/50">Geçerli bir bağlantı linki ile erişim sağlayın.</p>
            </div>
        </div>

        <div id="loginFormArea" class="hidden">
            <div class="info-message text-center mb-6">
                <i class="fa-solid fa-database text-[#7cfc00] mr-2"></i>
                <span class="text-[11px] font-bold">SUPABASE BAĞLANTISI TESPİT EDİLDİ</span>
                <p class="text-[10px] mt-1">Lütfen yönetici hesabınızla giriş yapın</p>
            </div>

            <form id="loginForm" onsubmit="return false;">
                <div class="form-group input-icon">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" class="input-box" placeholder="E-posta Adresi" required autocomplete="email">
                </div>
                
                <div class="form-group input-icon">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" class="input-box" placeholder="Şifre" required autocomplete="current-password">
                </div>
                
                <button type="submit" id="loginBtn" class="login-btn">
                    <span id="btnText">GİRİŞ YAP</span>
                    <span id="btnLoader" class="hidden"><span class="loading-spinner"></span></span>
                </button>
            </form>
        </div>
    </div>

    <script src="js/core/cookie.js"></script>
    <script src="js/core/toast.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/supabase.js"></script>
    <script src="js/modules/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
